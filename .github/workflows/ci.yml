# 每次推送都在 Windows、macOS、Linux 上跑一次：型別檢查、一致性檢查（tools/check.ts），
# 再用模擬手機把整個流程跑一遍（tools/smoke-test.ts）；另外編一次手機 App。
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # 模擬手機用 ffmpeg 產生測試影片
      # Linux 從 GitHub 下載編好的 ffmpeg（BtbN/FFmpeg-Builds）：apt 的套件來源有時很慢，20 分鐘都裝不完。
      # 哪天下載不到（404），把網址裡的 n9.0、9.0 換成那邊最新的正式版。
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          curl -fsSL --retry 3 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-9.0.tar.xz | tar -xJ -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg/bin/ffmpeg" -hide_banner -version | sed -n 1p
      - name: Install ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install ffmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - run: npm ci
      - run: npm run typecheck
      - run: npm run check
      - run: npm run smoke-test

  android:
    name: Android app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug
